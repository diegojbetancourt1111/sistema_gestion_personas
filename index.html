<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión de Personas</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 97%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Gestión de Personas</h2>

    <!-- Formulario para captura de datos -->
    <div class="form-group">
        <label>Nombre Completo:</label>
        <input type="text" id="nombreInput" placeholder="Ej: Carlos Pérez">
    </div>

    <div class="form-group">
        <label>Correo Electrónico:</label>
        <input type="email" id="correoInput" placeholder="Ej: carlos@email.com">
    </div>

    <div class="form-group">
        <label>Edad:</label>
        <input type="number" id="edadInput" placeholder="Ej: 28">
    </div>

    <button class="btn-add" onclick="agregarPersona()">Registrar Persona</button>

    <hr style="margin: 25px 0;">

    <!-- Filtro/Buscador dinámico en tiempo real -->
    <div class="form-group">
        <label>🔍 Buscar en tiempo real :</label>
        <input type="text" id="buscarInput" placeholder="Escribe un nombre para buscar..." onkeyup="filtrarPersonas()">
    </div>

    <!-- Tabla dinámica donde pintamos los registros -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Edad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaCuerpo">
        <!-- JavaScript inyectará las filas aquí dinámicamente -->
        </tbody>
    </table>
</div>

<!-- Enlazamos la lógica de JavaScript -->
<script src="app.js"></script>

</body>
</html>
